source:
  type: postgres
  serviceName: games_database
  serviceConnection:
    config:
      type: Postgres
      hostPort: postgres:5432 
      username: postgres
      authType:
        password: postgres
      database: games_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes: [public]
      tableFilterPattern:
        includes: [games_brut, games_clean, games_gold, game_tags, game_genres, game_developers, game_publishers]

sink:
  type: metadata-rest
  config: {}

